name: jamf-mcp

services:
  jamf-mcp:
    build:
      context: .
      secrets:
        - build_ca
    user: "${JAMF_LOCAL_UID:-1000}:${JAMF_LOCAL_GID:-1000}"
    env_file:
      - path: .env.local
      - path: .env
        required: false
    environment:
      JAMF_MCP_REMOTE_AUTH_MODE: bearer
      JAMF_MCP_RESOURCE_URL: https://localhost:8443/mcp
      JAMF_MCP_VALIDATION_TOKEN: "${JAMF_MCP_LOCAL_TOKEN:?Run scripts/setup_local_docker.py first}"
      JAMF_MCP_BEARER_TOKENS_JSON: >-
        [{"identity":"local-reader","token":"${JAMF_MCP_LOCAL_TOKEN}","scopes":["jamf:read"]}]
    command:
      - jamf-mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --products
      - pro
      - platform
      - docs
      - --read-only
      - --ssl-certfile
      - /run/tls/server.crt
      - --ssl-keyfile
      - /run/tls/server.key
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./.docker-local:/run/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl, httpx; r=httpx.get('https://localhost:8443/mcp', verify=ssl.create_default_context(cafile='/run/tls/server.crt'), timeout=5); assert r.status_code == 401"
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

secrets:
  build_ca:
    file: ./.docker-local/build-ca.pem
